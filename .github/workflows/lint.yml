name: Lint

on:
  pull_request:
    paths-ignore:
      - ".github/workflows/**"
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Install lint dependencies
        run: uv sync --locked --only-group lint

      - name: Ruff check
        run: uv run ruff check --output-format=github src

      - name: Ruff format
        run: uv run ruff format --check src

  tailwind:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install Tailwind
        run: npm ci

      - name: Check main.css is up to date
        run: |
          npm run build:css
          git diff --exit-code src/static/css/main.css || {
            echo "::error::main.css is out of date. Run 'npm run build:css' and commit the result."
            exit 1
          }
