{% load app_tags %}

{# An entry tile's button, which opens the tracking form for its `entry`, loaded on every click so it has any rating set from the tile #}
<div x-data="{ trackOpen: false }">
  <button class="tooltip flex size-8 cursor-pointer items-center justify-center rounded-lg bg-white/5 text-gray-300 ring-1 ring-white/10 transition-colors hover:bg-white/10 hover:text-white"
          data-tooltip="Edit entry"
          aria-label="Edit entry"
          hx-get="{% media_view_url 'track_modal' media %}"
          hx-vals='{"return_url": "{{ request.get_full_path|urlencode }}", "instance_id": "{{ entry.id }}"}'
          hx-target="#{% component_id 'track' media entry.id %}">
    {% include "app/icons/edit.svg" with classes="size-4" %}
  </button>

  <div x-cloak
       x-show="trackOpen"
       @keydown.escape.window="trackOpen = false"
       @dialog-dismiss="trackOpen = false"
       class="dialog-backdrop">
    <div class="dialog-box">
      <div id="{% component_id 'track' media entry.id %}"></div>
    </div>
  </div>
</div>
