{# A dialog sheet's grab handle for phones, then its `title` and a close button running the Alpine expression `close` #}
<div class="mx-auto mt-2 h-1 w-10 shrink-0 rounded-full bg-white/20 sm:hidden"
     aria-hidden="true"></div>
<div class="dialog-header">
  <h2 class="line-clamp-1 text-base font-semibold text-white">{{ title }}</h2>
  <button type="button"
          aria-label="Close"
          class="flex size-8 shrink-0 cursor-pointer items-center justify-center rounded-lg text-gray-400 transition-colors hover:bg-white/10 hover:text-white"
          @click="{{ close }}">{% include "app/icons/x.svg" with classes="size-5" %}</button>
</div>
