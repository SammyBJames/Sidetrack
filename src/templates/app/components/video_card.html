{# A video's YouTube thumbnail, which plays it in the page's video player #}
<button type="button"
        class="hover-tap relative block cursor-pointer overflow-hidden rounded-xl bg-surface-800 text-start shadow-lg ring-1 shadow-black/30 ring-white/10 transition duration-300 hover:shadow-black/60 hover:ring-white/30"
        title="{{ entry.name }}"
        @click="playing = '{{ entry.key|escapejs }}'">
  <img alt=""
       class="lazyload aspect-video w-full bg-surface-600 object-cover transition duration-500 ease-out parent-hover-tap:scale-105"
       data-src="https://i.ytimg.com/vi/{{ entry.key }}/hqdefault.jpg"
       src="{{ IMG_NONE }}">
  <div class="pointer-events-none absolute inset-0 bg-linear-to-t from-black/90 via-black/30 to-transparent"></div>
  <span class="card-chip absolute top-1/2 left-1/2 flex size-11 -translate-1/2 items-center justify-center text-white transition parent-hover-tap:scale-110">
    {% include "app/icons/play.svg" with classes="size-5 translate-x-px" %}
  </span>
  <div class="absolute inset-x-0 bottom-0 px-3 pt-3 pb-2.5">
    <div class="line-clamp-1 text-sm font-semibold text-white drop-shadow-md">{{ entry.name }}</div>
    <div class="mt-0.5 text-xs text-gray-300">{{ entry.type }}</div>
  </div>
</button>
