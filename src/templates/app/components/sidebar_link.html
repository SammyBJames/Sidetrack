{% load app_tags %}

{# A sidebar link to `url` with `icon`'s template, or `media_icon`'s media type icon, lit in its color while `active` #}
<a href="{{ url }}"
   {% if active %}aria-current="page"{% endif %}
   class="flex items-center gap-3 rounded-xl px-3 py-2 text-sm font-medium transition-colors duration-200 {% if active %}bg-white/[0.07] text-white ring-1 ring-white/10 ring-inset{% else %}text-gray-400 hover:bg-white/[0.04] hover:text-gray-100{% endif %}">
  {% if media_icon %}
    <span class="{% if active %}{{ media_icon|media_color }}{% endif %}">{% icon media_icon is_active=False %}</span>
  {% else %}
    <span class="{% if active %}text-indigo-400{% endif %}">{% include icon with classes="w-5 h-5" %}</span>
  {% endif %}
  <span class="truncate">{{ label }}</span>
</a>
