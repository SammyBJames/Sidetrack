{% load app_tags %}

{% for media in media_list %}
  {% include "app/components/media_row.html" with item=media.item %}
{% endfor %}

{# Loads the next page when scrolled into view, kept apart from the rows so any row can be removed #}
{% if media_list.has_next %}
  <div class="h-px"
       hx-get="{% url 'medialist' target_user.username media_type %}?page={{ media_list.next_page_number }}"
       hx-trigger="revealed threshold:200px"
       hx-swap="outerHTML"
       hx-include="#filter-form"></div>
{% endif %}
