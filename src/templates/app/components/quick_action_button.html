{% load app_tags %}

{# The status of a media card, which on hover turns into its one-click action to the next status #}
{% get_quick_action item.media_type media as quick %}
<div class="relative size-7 shrink-0">
  {% if quick %}
    <button class="card-chip group/qa pointer-events-auto absolute top-0 right-0 flex h-7 cursor-pointer items-center overflow-hidden text-white transition-all duration-200 hover:ring-white/40 disabled:cursor-wait{% if user.clickable_media_cards %} pointer-coarse:pointer-events-none{% endif %}"
            title="{{ quick.label }}"
            aria-label="{{ quick.label }}"
            {% if card == "home" and quick.key == "next" %} hx-post="{% url 'progress_edit' item.media_type media.id %}" hx-vals='{"operation": "increase", "home_status": "{{ home_status }}"}' {% else %} hx-post="{% url 'quick_action' %}" hx-vals='{"media_id": "{{ item.media_id|escapejs }}", "source": "{{ item.source }}", "media_type": "{{ item.media_type }}", "season_number": "{{ item.season_number|default_if_none:'' }}", "instance_id": "{{ media.id|default_if_none:'' }}", "action": "{{ quick.key }}", "card": "{{ card }}", "title": "{{ title|escapejs }}", "release_year": "{{ year }}", "active": "{{ active|yesno:'true,' }}"}' {% endif %}
            hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
            {% if filtered %}hx-include="#filter-form"{% endif %}
            hx-target="closest .media-card"
            hx-swap="outerHTML"
            hx-disabled-elt="this">
      {# The next status's color fills in on hover #}
      <span class="absolute inset-0 opacity-0 transition-opacity duration-200 group-hover/qa:opacity-100 {{ quick.target_status|status_button_color }}"></span>
      <span class="relative max-w-0 overflow-hidden text-xs font-semibold whitespace-nowrap transition-all duration-300 group-hover/qa:max-w-32 group-hover/qa:pl-2.5">{{ quick.label }}</span>
      <span class="relative flex size-7 shrink-0 items-center justify-center">
        <span class="size-3.5 group-hover/qa:hidden [.htmx-request_&]:invisible {% if media.status %}{{ media.status|status_color }}{% else %}text-gray-200{% endif %}">
          {% if media.status %}
            {% include media.status|status_icon with classes="size-3.5" %}
          {% else %}
            {% include "app/icons/plus.svg" with classes="size-3.5" %}
          {% endif %}
        </span>
        <span class="hidden size-3.5 group-hover/qa:block [.htmx-request_&]:invisible">
          {% include quick.icon with classes="size-3.5" %}
        </span>
        <span class="htmx-indicator absolute size-3.5 animate-spin">
          {% include "app/icons/circle-spinning-clockwise.svg" with classes="size-3.5" %}
        </span>
      </span>
    </button>
  {% elif media.status %}
    {% include "app/components/status_badge.html" with status=media.status %}
  {% endif %}
</div>
