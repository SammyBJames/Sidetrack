{% load app_tags %}

{# A media type's list's statuses with how many media each has, refreshed when an action on a card changes them #}
<div id="library-status"
     hx-get="{% url 'medialist' target_user.username media_type %}?part=counts"
     hx-include="#filter-form"
     hx-trigger="libraryChanged from:body"
     hx-swap="outerHTML"
     role="group"
     aria-label="Status"
     class="chip-row">
  {% for choice in status_choices %}
    {% with active=choice.value|str_equals:current_status %}
      <button type="button"
              @click="set('status', '{{ choice.value|escapejs }}')"
              aria-pressed="{{ active|yesno:'true,false' }}"
              class="chip {% if active %}chip-on{% else %}chip-off{% endif %}">
        {% if choice.caught_up %}
          {# Caught up media waits like planned media, so it's in its color #}
          <span class="{{ Status.PLANNING.value|status_color }}">
            {% include "app/icons/clock.svg" with classes="size-3.5" %}
          </span>
        {% elif not choice.all %}
          <span class="{{ choice.value|status_color }}">{% include choice.value|status_icon with classes="size-3.5" %}</span>
        {% endif %}
        {{ choice.label }}
        <span class="text-xs tabular-nums {% if active %}text-gray-300{% else %}text-gray-500{% endif %}">{{ choice.count }}</span>
      </button>
    {% endwith %}
  {% endfor %}
</div>
