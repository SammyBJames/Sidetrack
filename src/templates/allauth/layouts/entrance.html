{% extends "allauth/layouts/base.html" %}
{% load allauth account %}

{% block body %}
  <div class="flex min-h-screen bg-surface-900 text-gray-100">
    <div class="flex-1 flex flex-col justify-center lg:pb-40 items-center p-4">
      <div class="w-full max-w-md">
        <div class="text-center mb-8">
          <h1 class="mb-3 flex items-center justify-center gap-3 text-3xl font-bold tracking-tight text-white">
            {% include "app/components/logo.svg" with classes="size-11 shrink-0" %}
            <span><span class="text-indigo-400">Side</span>track</span>
          </h1>

          <p class="text-gray-400">
            {% block content_title %}
            {% endblock content_title %}
          </p>

        </div>
        <div class="bg-surface-800 rounded-lg p-8 shadow-lg">
          {% block content %}
          {% endblock content %}
        </div>
      </div>
    </div>
  </div>

{% endblock body %}
